<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#010101"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="TikTok Ürünler"/>
  <title>TikTok Made Me Buy It</title>
  <link rel="manifest" href="/manifest.json"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#010101;--surface:#161616;--surface2:#222;--border:#2c2c2c;
      --text:#f1f1f1;--muted:#888;--accent:#fe2c55;--teal:#25f4ee;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bot:env(safe-area-inset-bottom,0px);
    }
    html{height:100%}
    body{
      background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      min-height:100%;overflow-x:hidden;
    }

    /* ── Header ── */
    header{
      position:sticky;top:0;z-index:99;
      background:rgba(1,1,1,.92);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      padding:calc(var(--safe-top) + 12px) 16px 12px;
    }
    .header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1rem}
    .logo svg{flex-shrink:0}
    #scanBtn{
      background:var(--accent);color:#fff;border:none;
      border-radius:999px;padding:8px 18px;font-size:.85rem;font-weight:700;
      cursor:pointer;white-space:nowrap;
    }
    #scanBtn:active{opacity:.75}

    /* ── Countdown ── */
    #countdown{
      text-align:center;font-size:.75rem;color:var(--muted);
      padding:6px;background:var(--surface);
    }
    #countdown span{color:var(--teal);font-weight:600}

    /* ── Filters ── */
    .filters{
      display:flex;gap:8px;padding:12px 16px;
      overflow-x:auto;scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none}
    .chip{
      background:var(--surface2);border:1px solid var(--border);
      border-radius:999px;color:var(--text);padding:7px 14px;
      font-size:.8rem;cursor:pointer;white-space:nowrap;flex-shrink:0;
      transition:background .15s,border-color .15s,color .15s;
    }
    .chip.active,.chip:active{
      background:var(--accent);border-color:var(--accent);color:#fff;
    }

    /* ── Grid ── */
    #grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:12px;padding:0 12px 40px;
    }

    /* ── Card ── */
    .card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:14px;overflow:hidden;text-decoration:none;color:var(--text);
      display:flex;flex-direction:column;
      transition:transform .2s;
      -webkit-tap-highlight-color:transparent;
    }
    .card:active{transform:scale(.97)}
    .thumb{
      aspect-ratio:1;overflow:hidden;background:var(--surface2);
      display:flex;align-items:center;justify-content:center;font-size:2rem;
    }
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
    .product-title{
      font-size:.82rem;font-weight:600;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .category{font-size:.72rem;color:var(--teal)}
    .stats{display:flex;gap:8px;font-size:.72rem;color:var(--muted);margin-top:auto;padding-top:6px}
    .growth{color:#4ade80;font-weight:700}

    /* ── Loading ── */
    #loading{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:80px 20px;gap:16px;
    }
    .spinner{
      width:40px;height:40px;border:4px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    #loading p{color:var(--muted);font-size:.9rem}

    /* ── Empty / Error ── */
    #empty,#err{
      text-align:center;padding:60px 24px;color:var(--muted);
      display:flex;flex-direction:column;gap:12px;align-items:center;
    }
    #err .err-title{font-size:1rem;font-weight:700;color:var(--accent)}
    #err code{background:var(--surface2);border-radius:6px;padding:2px 6px;color:var(--teal);font-size:.8rem}
    #err button{
      margin-top:8px;background:var(--accent);color:#fff;border:none;
      border-radius:999px;padding:10px 24px;font-size:.9rem;font-weight:700;cursor:pointer;
    }

    .hidden{display:none!important}
    #grid.hidden,#loading.hidden,#empty.hidden,#err.hidden{display:none!important}
  </style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#010101"/>
        <path d="M22.5 8.5c.8 1 2 1.6 3.3 1.6v3.2c-1.1 0-2.2-.3-3.1-.9v6.4c0 3.5-2.8 6.3-6.3 6.3S10 22.3 10 18.8s2.8-6.3 6.3-6.3c.2 0 .5 0 .7.1v3.3c-.2-.1-.5-.1-.7-.1-1.7 0-3.1 1.4-3.1 3.1s1.4 3.1 3.1 3.1 3.1-1.4 3.1-3.1V8.5h3.1z" fill="white"/>
        <path d="M22.5 8.5c.8 1 2 1.6 3.3 1.6v3.2c-1.1 0-2.2-.3-3.1-.9v6.4c0 3.5-2.8 6.3-6.3 6.3S10 22.3 10 18.8s2.8-6.3 6.3-6.3c.2 0 .5 0 .7.1v3.3c-.2-.1-.5-.1-.7-.1-1.7 0-3.1 1.4-3.1 3.1s1.4 3.1 3.1 3.1 3.1-1.4 3.1-3.1V8.5h3.1z" fill="#69C9D0" opacity=".5"/>
      </svg>
      TikTok Ürünler
    </div>
    <button id="scanBtn" onclick="scan()">🔄 Tara</button>
  </div>
</header>

<div id="countdown">Sonraki otomatik tarama: <span id="timer">30:00</span></div>

<div class="filters" id="filters">
  <button class="chip active" data-period="7" onclick="setPeriod(this,7)">Bu Hafta</button>
  <button class="chip" data-period="30" onclick="setPeriod(this,30)">Bu Ay</button>
  <button class="chip" data-period="120" onclick="setPeriod(this,120)">4 Ay</button>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>TikTok taranıyor...</p>
</div>
<div id="grid" class="hidden"></div>
<div id="empty" class="hidden">
  <div style="font-size:3rem">🛒</div>
  <p>Şu an ürün bulunamadı.</p>
</div>
<div id="err" class="hidden">
  <div class="err-title">⚠️ Bağlantı Hatası</div>
  <p id="errMsg"></p>
  <button onclick="scan()">Tekrar Dene</button>
</div>

<script>
  let period = 7;
  let countdown = 30 * 60; // seconds
  let timerInterval;

  function fmt(n) {
    if (!n && n !== 0) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  function fmtGrowth(v) {
    if (v == null) return null;
    const pct = (v * 100).toFixed(0);
    return `+${pct}%`;
  }

  function card(p) {
    const img = p.cover
      ? `<img src="${p.cover}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '🛍️';
    const growth = fmtGrowth(p.revenue_growth);
    return `
      <a class="card" href="${p.link}" target="_blank" rel="noopener">
        <div class="thumb">${img}</div>
        <div class="info">
          <div class="product-title">${p.title || '(ürün adı yok)'}</div>
          ${p.category ? `<div class="category">${p.category}</div>` : ''}
          <div class="stats">
            ${p.sold_count != null ? `<span>🛒 ${fmt(p.sold_count)}</span>` : ''}
            ${growth ? `<span class="growth">${growth}</span>` : ''}
            ${p.price != null ? `<span>💰${p.price}</span>` : ''}
          </div>
        </div>
      </a>`;
  }

  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }

  async function scan() {
    hide('grid'); hide('empty'); hide('err');
    show('loading');
    resetCountdown();

    try {
      const res = await fetch(`/api/products?period=${period}&country=TR`);
      const data = await res.json();

      if (!data.ok) throw new Error(data.error || 'Bilinmeyen hata');

      hide('loading');
      const grid = document.getElementById('grid');

      if (!data.products.length) {
        show('empty');
        return;
      }

      grid.innerHTML = data.products.map(card).join('');
      show('grid');

      // Cache to localStorage
      localStorage.setItem('tiktok_products', JSON.stringify({ ts: Date.now(), products: data.products, period }));
    } catch (e) {
      hide('loading');
      document.getElementById('errMsg').textContent = e.message;
      show('err');

      // Try loading from cache
      loadCache();
    }
  }

  function loadCache() {
    try {
      const raw = localStorage.getItem('tiktok_products');
      if (!raw) return;
      const { products, ts } = JSON.parse(raw);
      if (!products?.length) return;
      const age = Math.round((Date.now() - ts) / 60000);
      document.getElementById('grid').innerHTML =
        `<div style="grid-column:1/-1;text-align:center;font-size:.75rem;color:var(--muted);padding:8px 0">
          ⚠️ Önbellekten yüklendi (${age} dk önce)
        </div>` + products.map(card).join('');
      show('grid');
    } catch (_) {}
  }

  function setPeriod(btn, p) {
    period = p;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    scan();
  }

  function resetCountdown() {
    countdown = 30 * 60;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      countdown--;
      if (countdown <= 0) { scan(); return; }
      const m = String(Math.floor(countdown / 60)).padStart(2, '0');
      const s = String(countdown % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }, 1000);
  }

  // Start
  scan();
</script>
</body>
</html>
